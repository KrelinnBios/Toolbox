<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      name="description"
      content="面向所有人的在线工具与资源导航。"
    >
    <meta name="theme-color" content="#eeff41">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="shortcut icon" href="./favicon.svg?v=202609251">
    <link rel="icon" href="./favicon.svg?v=202609251">
    <meta property="og:title" content="Toolbox - 工具导航">
    <meta property="og:description" content="面向所有人的在线工具与资源导航。">
    <meta property="og:url" content="https://toolbox.krelinnbios.com/">
    <title>Toolbox - 工具导航</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Noto+Sans+SC:wght@400;700;900&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="./toolbox.css?v=2026092545">
    <script src="./sites.js?v=2026092517" defer></script>
    <script src="./toolbox.js?v=2026092513" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">跳到主要内容</a>

    <div class="tools-layout">
      <aside class="tools-sidebar" aria-labelledby="directory-label">
        <p class="tools-directory-label" id="directory-label" hidden>分类目录</p>
        <div class="tools-tabs" id="tools-tabs" role="group" aria-labelledby="directory-label"></div>

        <div class="tools-sidebar-links">
          <a
            class="tools-sidebar-link"
            href="https://github.com/KrelinnBios"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="GitHub"
            title="GitHub"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path fill="currentColor" d="M12 .5C5.37.5 0 5.87 0 12.5c0 5.3 3.44 9.8 8.21 11.39.6.11.82-.26.82-.58v-2.03c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.73.08-.73 1.21.09 1.84 1.24 1.84 1.24 1.07 1.84 2.81 1.31 3.5 1 .11-.78.42-1.31.76-1.61-2.67-.3-5.47-1.34-5.47-5.95 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.29-1.55 3.3-1.23 3.3-1.23.66 1.66.24 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.62-2.81 5.64-5.49 5.94.43.37.81 1.1.81 2.22v3.29c0 .32.22.7.83.58C20.56 22.29 24 17.79 24 12.5 24 5.87 18.63.5 12 .5Z" />
            </svg>
          </a>
          <a
            class="tools-sidebar-link"
            href="https://krelinnbios.com/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="个人主页"
            title="个人主页"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M3 10.8 12 3.5l9 7.3V21H3z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" />
              <path d="M9.5 21v-5.5h5V21" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" />
            </svg>
          </a>
        </div>
      </aside>

      <main id="main" tabindex="-1">
        <section class="tools-profile" aria-labelledby="tools-title">
          <div class="tools-heading">
            <h1 id="tools-title">工具导航</h1>
          </div>
          <p class="tools-total" id="tools-total" aria-live="polite"></p>
        </section>

        <section class="tools-toolbar" aria-label="站点筛选">
          <label class="tools-search" for="site-search">
            <svg class="tools-search-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="m20 20-4.35-4.35"></path>
            </svg>
            <input
              id="site-search"
              type="search"
              placeholder="搜索站点、用途或域名"
              autocomplete="off"
              aria-label="搜索工具站点"
            >
          </label>
        </section>

        <div class="tools-results-head">
          <p class="tools-view-title" id="tools-view-title">全部站点</p>
          <p class="tools-count" id="tools-count" role="status" aria-live="polite"></p>
        </div>
        <p class="tools-empty" id="tools-empty" hidden>没有找到匹配的站点，换个关键词试试。</p>

        <div class="tools-sections" id="tools-sections"></div>
      </main>
    </div>

  </body>
</html>
